<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music — Packetcat</title>
<meta name="description" content="Packetcat: computer technician learning web app penetration testing through TryHackMe CTFs, Kali Linux on a Raspberry Pi 5, and hands-on labs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">



</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<!-- Top bar: tmux-style window list -->
<nav class="tmux" aria-label="Main">
  <span class="tmux__session">packetcat</span>
  <ul class="tmux__windows">
    <li><a href="index.html">1:home</a></li>
    <li><a href="about.html">2:about</a></li>
    <li><a href="writeups.html">3:writeups</a></li>
    <li><a href="links.html">4:links</a></li>
    <li><a href="Music-Share.html" aria-current="page">5:music</a></li>
  </ul>
  <span class="tmux__host">kali@rpi5</span>
</nav>

<main id="main">
  <h1 class="flag" style="text-align: center;">Enjoy the Music!</h1>

  <!-- Terminal-style Music Player Component -->
  <div class="terminal-player" aria-label="Audio Player">
    <div class="terminal-player__header">
      <span class="terminal-player__title">audio_player.sh</span>
      <span class="terminal-player__status" data-player-status>stopped</span>
    </div>
    
    <div class="terminal-player__body">
      <!-- Hidden native audio element -->
      <audio id="bg-audio" preload="none"></audio>

      <div class="terminal-player__track-info">
        <span class="prompt">$</span> playing: <span id="current-track">select_track.mp3</span>
      </div>

      <!-- Playlist Selection -->
      <div class="playlist">
        <!-- EDIT THESE TO MATCH YOUR MP3 FILENAMES -->
        <button class="playlist-item active" data-src="Music/Checksum Red.mp3">1. Checksum Red.mp3</button>
        <button class="playlist-item" data-src="Music/Defending the Undefended.mp3">2. Defending the Undefended.mp3</button>
        <button class="playlist-item" data-src="Music/No Password for This.mp3">3. No Password for This.mp3</button>
        <button class="playlist-item" data-src="Music/No Throne, No Masters.mp3">4. No Throne, No Masters.mp3</button>
        <button class="playlist-item" data-src="Music/Thread at 2.mp3">5. Thread at 2.mp3</button>
        <button class="playlist-item" data-src="Music/Where Trespass Dies.mp3">6. Where Trespass Dies.mp3</button>
      </div>

      <!-- Controls styled like CLI commands -->
      <div class="terminal-player__controls">
        <button class="term-btn" id="play-btn" aria-label="Play audio">[play]</button>
        <button class="term-btn" id="pause-btn" aria-label="Pause audio" disabled>[pause]</button>
        <button class="term-btn" id="stop-btn" aria-label="Stop audio" disabled>[stop]</button>
        
        <div class="terminal-player__volume">
          <span>vol:</span>
          <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
        </div>
      </div>
    </div>
  </div>
</main>

<div class="status">
  <span class="status__dot"></span>
  <span>session: home</span>
  <span class="status__clock" data-clock>--:--:--</span>
</div>

<script>
  // Clock update logic
  function updateClock() {
    const now = new Date();
    const clockEl = document.querySelector('[data-clock]');
    if (clockEl) {
      clockEl.textContent = now.toTimeString().split(' ')[0];
    }
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Terminal Audio Player Functionality with Playlist Support
  document.addEventListener('DOMContentLoaded', () => {
    const audio = document.getElementById('bg-audio');
    const playBtn = document.getElementById('play-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const stopBtn = document.getElementById('stop-btn');
    const volumeSlider = document.getElementById('volume-slider');
    const statusIndicator = document.querySelector('[data-player-status]');
    const currentTrackDisplay = document.getElementById('current-track');
    const playlistButtons = document.querySelectorAll('.playlist-item');

    if (!audio) return;

    audio.volume = volumeSlider.value;
    let currentTrackSrc = playlistButtons[0]?.getAttribute('data-src');
    if (currentTrackSrc) {
      audio.src = currentTrackSrc;
      currentTrackDisplay.textContent = currentTrackSrc.split('/').pop();
    }

    // Playlist track switching
    playlistButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        playlistButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        currentTrackSrc = btn.getAttribute('data-src');
        audio.src = currentTrackSrc;
        currentTrackDisplay.textContent = currentTrackSrc.split('/').pop();

        audio.play();
        statusIndicator.textContent = 'playing';
        playBtn.disabled = true;
        pauseBtn.disabled = false;
        stopBtn.disabled = false;
      });
    });

    playBtn.addEventListener('click', () => {
      if (!audio.src) return;
      audio.play();
      statusIndicator.textContent = 'playing';
      playBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;
    });

    pauseBtn.addEventListener('click', () => {
      audio.pause();
      statusIndicator.textContent = 'paused';
      playBtn.disabled = false;
      pauseBtn.disabled = true;
    });

    stopBtn.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      statusIndicator.textContent = 'stopped';
      playBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
    });

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });

    audio.addEventListener('ended', () => {
      statusIndicator.textContent = 'stopped';
      playBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
    });
  });
</script>
</body>
</html>
